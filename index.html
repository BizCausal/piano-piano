<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Piano Piano</title>
<meta name="description" content="Everyday Italian, little by little: phrases, audio and quick quizzes for the family.">
<meta name="theme-color" content="#e3ebf8" media="(prefers-color-scheme: light)" id="tcLight">
<meta name="theme-color" content="#141c29" media="(prefers-color-scheme: dark)" id="tcDark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Piano Piano">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&family=Unbounded:wght@500;700;800&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,200..800&display=swap">
<style>
/* Layout: Bilgi's full-height snap feed of cards, each tinted in one Florentine glaze hue per topic,
   under a floating score bar; sheets slide up for the phrasebook, progress and settings. */
:root{
  --font-display:"Unbounded","Arial Black",system-ui,sans-serif;
  --font-body:"Schibsted Grotesk",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --cs:62%; --cl:92%; --ts:55%; --tl:98%; --es:38%; --el:80%; --as:72%; --al:30%; --qs:45%; --ql:12%; --ms:16%; --ml:36%;
  --on-acc:#ffffff;
  --ink:#121521; --ink-2:#4d5466; --ink-3:#7b8193;
  --surface:#ffffff; --surface-2:#f1f3f8; --seg-on:#ffffff; --line:rgba(18,21,33,.10);
  --hud:rgba(255,255,255,.76); --hud-line:rgba(18,21,33,.08);
  --gold:#a86b00; --gold-hi:#f2b233; --gold-soft:#fff0cc; --gold-ink:#1d1400;
  --good:#16805a; --bad:#bf3626;
  --scrim:rgba(12,14,22,.42);
  --shadow:0 18px 50px -18px rgba(18,21,33,.38);
  --cur-h:218;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --cs:36%; --cl:12%; --ts:28%; --tl:17%; --es:24%; --el:28%; --as:78%; --al:66%; --qs:30%; --ql:95%; --ms:14%; --ml:70%;
    --on-acc:#0b0d14; --ink:#eef0f6; --ink-2:#a8aebe; --ink-3:#727a8d;
    --surface:#151823; --surface-2:#1d2131; --seg-on:#2c3247; --line:rgba(255,255,255,.09);
    --hud:rgba(14,16,24,.64); --hud-line:rgba(255,255,255,.08);
    --gold:#f4b63c; --gold-hi:#ffd36b; --gold-soft:#3d2c0c; --gold-ink:#1d1400;
    --good:#47c98f; --bad:#ff7d6c; --scrim:rgba(0,0,0,.58); --shadow:0 18px 50px -18px rgba(0,0,0,.75);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --cs:36%; --cl:12%; --ts:28%; --tl:17%; --es:24%; --el:28%; --as:78%; --al:66%; --qs:30%; --ql:95%; --ms:14%; --ml:70%;
  --on-acc:#0b0d14; --ink:#eef0f6; --ink-2:#a8aebe; --ink-3:#727a8d;
  --surface:#151823; --surface-2:#1d2131; --seg-on:#2c3247; --line:rgba(255,255,255,.09);
  --hud:rgba(14,16,24,.64); --hud-line:rgba(255,255,255,.08);
  --gold:#f4b63c; --gold-hi:#ffd36b; --gold-soft:#3d2c0c; --gold-ink:#1d1400;
  --good:#47c98f; --bad:#ff7d6c; --scrim:rgba(0,0,0,.58); --shadow:0 18px 50px -18px rgba(0,0,0,.75);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{height:100%;-webkit-text-size-adjust:100%}
body{height:100%;margin:0;overflow:hidden;font-family:var(--font-body);font-size:15px;color:var(--ink);
  background:hsl(var(--cur-h) var(--cs) var(--cl));-webkit-font-smoothing:antialiased;transition:background-color .35s ease}
button{font:inherit;color:inherit;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
svg{display:block}
.app{position:relative;height:100%}

/* ---------- Feed ---------- */
.feed{position:relative;height:100%;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;overflow-anchor:none;
  scroll-snap-type:y mandatory;scrollbar-width:none;outline:none}
.feed::-webkit-scrollbar{display:none}
.card{--h:218;position:relative;min-height:100%;scroll-snap-align:start;scroll-snap-stop:always;display:flex;flex-direction:column;
  background:hsl(var(--h) var(--cs) var(--cl));color:hsl(var(--h) var(--qs) var(--ql));overflow:hidden}
.card.bonus{box-shadow:inset 0 0 0 3px var(--gold-hi)}
.card-in{position:relative;z-index:1;flex:1;display:flex;flex-direction:column;justify-content:flex-start;gap:18px;width:100%;max-width:620px;margin:0 auto;
  padding-top:calc(env(safe-area-inset-top,0px) + clamp(108px, 17vh, 180px));padding-bottom:calc(env(safe-area-inset-bottom,0px) + 92px);padding-left:max(20px, env(safe-area-inset-left,0px));padding-right:max(20px, env(safe-area-inset-right,0px))}
.motif{position:absolute;top:-96px;right:-130px;width:430px;height:430px;fill:none;stroke:hsl(var(--h) var(--as) var(--al));stroke-width:.55;opacity:.22;pointer-events:none}
.motif.low{top:auto;bottom:-150px;right:auto;left:-150px;opacity:.12}

.meta{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;font-size:.78rem;font-weight:600}
.topic-chip{display:inline-flex;align-items:center;gap:7px;padding:6px 11px 6px 9px;border-radius:999px;background:hsl(var(--h) var(--as) var(--al));color:var(--on-acc);
  text-transform:uppercase;letter-spacing:.09em;font-size:.68rem;font-weight:800}
.topic-chip svg{width:12px;height:12px;fill:currentColor}
.lvl{color:hsl(var(--h) var(--ms) var(--ml));letter-spacing:.02em}
.pips{display:inline-flex;gap:4px;padding:0 2px}
.pips i{width:7px;height:7px;transform:rotate(45deg);border:1.5px solid hsl(var(--h) var(--as) var(--al));border-radius:1px}
.pips i.on{background:hsl(var(--h) var(--as) var(--al))}
.tag{padding:4px 8px;border-radius:6px;font-size:.66rem;text-transform:uppercase;letter-spacing:.09em;font-weight:800;color:hsl(var(--h) var(--ms) var(--ml));
  border:1px solid hsl(var(--h) var(--es) var(--el))}
.tag.new{background:hsl(var(--h) var(--as) var(--al));color:var(--on-acc);border-color:transparent}
.tag.bonus{background:var(--gold-soft);color:var(--gold);border-color:transparent;animation:shimmer 1.8s ease-in-out infinite}

.ask{margin:0;font:800 .72rem var(--font-display);letter-spacing:.14em;text-transform:uppercase;color:hsl(var(--h) var(--as) var(--al))}
.ask + *{margin-top:-8px}
.it-big{margin:0;font:800 clamp(1.75rem, 1.15rem + 3.2vw, 2.6rem)/1.12 var(--font-display);letter-spacing:-.025em;text-wrap:balance;overflow-wrap:anywhere}
.q{margin:0;font-weight:700;font-size:clamp(1.45rem, 1.1rem + 1.9vw, 2.1rem);line-height:1.2;letter-spacing:-.014em;text-wrap:pretty;max-width:30ch}

.say{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.playbtn{flex:none;width:60px;height:60px;border-radius:50%;border:0;display:grid;place-items:center;cursor:pointer;
  background:hsl(var(--h) var(--as) var(--al));color:var(--on-acc);transition:box-shadow .2s ease,transform .12s ease}
.playbtn svg{width:26px;height:26px}
.playbtn.big{width:108px;height:108px} .playbtn.big svg{width:46px;height:46px}
.playbtn.sm{width:46px;height:46px} .playbtn.sm svg{width:21px;height:21px}
.playbtn:active{transform:scale(.94)}
.slowbtn{min-height:46px;padding:0 16px;border-radius:999px;cursor:pointer;border:1.5px solid hsl(var(--h) var(--es) var(--el));
  background:hsl(var(--h) var(--ts) var(--tl));color:hsl(var(--h) var(--qs) var(--ql));font:700 .76rem var(--font-display);letter-spacing:.02em;transition:box-shadow .2s ease}
.playing{box-shadow:0 0 0 4px hsl(var(--h,218) var(--cs) var(--cl)),0 0 0 7px hsl(var(--h,218) var(--as) var(--al))}
.pron{margin:0;font-size:1.08rem;letter-spacing:.02em;color:hsl(var(--h) var(--ms) var(--ml))}
.pron b{color:hsl(var(--h) var(--as) var(--al));font-weight:800}
.mean{margin:0;font-weight:700;font-size:1.3rem;line-height:1.3}
.tip{padding:13px 15px;border-radius:12px;background:hsl(var(--h) var(--ts) var(--tl));border:1px solid hsl(var(--h) var(--es) var(--el));font-size:.97rem;line-height:1.45}
.tip i,.expl i{font-weight:700}

.opts{display:grid;gap:10px}
.opt{display:flex;align-items:center;gap:12px;width:100%;min-height:58px;padding:11px 14px;border-radius:12px;border:1.5px solid hsl(var(--h) var(--es) var(--el));
  background:hsl(var(--h) var(--ts) var(--tl));color:hsl(var(--h) var(--qs) var(--ql));text-align:left;font-size:1.05rem;font-weight:500;line-height:1.3;cursor:pointer;
  transition:transform .12s ease,border-color .15s,background-color .2s,opacity .25s}
.opt.it-opt{font-weight:700}
.opt kbd{flex:none;display:grid;place-items:center;width:28px;height:28px;border-radius:7px;font:700 .7rem var(--font-display);
  background:hsl(var(--h) var(--es) var(--el));color:hsl(var(--h) var(--qs) var(--ql))}
.opt kbd svg{width:15px;height:15px}
.opt span{min-width:0;overflow-wrap:anywhere}
@media (hover:hover){.card:not(.done) .opt:hover{border-color:hsl(var(--h) var(--as) var(--al))}}
.card:not(.done) .opt:active{transform:scale(.985)}
.opt:focus-visible,.btn:focus-visible,.mini:focus-visible,.next:focus-visible,.reveal-btn:focus-visible,.pill:focus-visible,.playbtn:focus-visible,.slowbtn:focus-visible,.seg button:focus-visible,.subpill:focus-visible,.langpill button:focus-visible{outline:3px solid hsl(var(--h,218) var(--as) var(--al));outline-offset:2px}
.card.done .opt{cursor:default}
.card.done .opts .opt:not(.right):not(.wrong):not(.reveal){opacity:.45}
.opt.right{background:hsl(var(--h) var(--as) var(--al));border-color:hsl(var(--h) var(--as) var(--al));color:var(--on-acc);animation:popIn .4s cubic-bezier(.2,1.5,.4,1)}
.opt.right kbd{background:var(--on-acc);color:hsl(var(--h) var(--as) var(--al))}
.opt.reveal{border-width:2px;border-color:hsl(var(--h) var(--as) var(--al))}
.opt.reveal kbd{background:hsl(var(--h) var(--as) var(--al));color:var(--on-acc)}
.opt.wrong{border-color:var(--bad);color:hsl(var(--h) var(--ms) var(--ml));text-decoration:line-through;text-decoration-thickness:1.5px;animation:shake .42s ease}
.opt.wrong kbd{background:var(--bad);color:#fff}

.recall{display:grid;gap:12px}
.reveal-btn{min-height:62px;border-radius:12px;border:1.5px dashed hsl(var(--h) var(--as) var(--al));background:transparent;color:hsl(var(--h) var(--as) var(--al));
  font:700 .88rem var(--font-display);cursor:pointer;padding:0 14px}
.answer-box{display:grid;gap:8px;padding:14px 16px;border-radius:12px;background:hsl(var(--h) var(--ts) var(--tl));border:1.5px solid hsl(var(--h) var(--as) var(--al));animation:rise .3s ease}
.answer-box small{display:block;text-transform:uppercase;letter-spacing:.1em;font-size:.66rem;font-weight:800;color:hsl(var(--h) var(--ms) var(--ml))}
.answer-box b{display:block;font:800 1.45rem/1.15 var(--font-display);letter-spacing:-.015em;overflow-wrap:anywhere}
.grade{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grade .opt{justify-content:center;font-weight:700}

.learn-actions{display:flex;gap:10px;margin-top:2px}
.learn-actions .btn{flex:1;min-height:58px;font-size:.95rem}

.result{display:grid;gap:10px;padding:15px 16px 12px;border-radius:14px;background:hsl(var(--h) var(--ts) var(--tl));border:1px solid hsl(var(--h) var(--es) var(--el));animation:rise .35s cubic-bezier(.2,.8,.2,1)}
.verdict{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.vicon{display:grid;place-items:center;width:24px;height:24px;border-radius:50%;color:#fff;flex:none}
.vicon svg{width:14px;height:14px}
.vicon.good{background:var(--good)} .vicon.bad{background:var(--bad)}
.verdict b{font:800 1.08rem var(--font-display);letter-spacing:-.01em}
.verdict .gain{font:800 .8rem var(--font-display);color:var(--gold);font-variant-numeric:tabular-nums}
.rphrase{display:grid;gap:2px}
.rphrase b{font:800 1.15rem/1.2 var(--font-display);letter-spacing:-.01em;overflow-wrap:anywhere}
.rphrase span{font-weight:600}
.expl{margin:0;font-size:.95rem;line-height:1.5;max-width:62ch}
.result-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.src{font-size:.76rem;color:hsl(var(--h) var(--ms) var(--ml))}

.next{position:absolute;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:2;display:inline-flex;align-items:center;gap:8px;padding:12px 22px;border-radius:999px;border:0;
  background:hsl(var(--h) var(--as) var(--al));color:var(--on-acc);font:700 .8rem var(--font-display);letter-spacing:.02em;cursor:pointer;opacity:0;pointer-events:none;transition:opacity .25s}
.next svg{width:15px;height:15px}
.card.done .next{opacity:1;pointer-events:auto;animation:nudge 1.8s ease-in-out .6s infinite}
.card.learn .next{animation:none}

/* Special cards */
.special .card-in{gap:14px;justify-content:center}
.eyebrow{margin:0;font:800 .7rem var(--font-display);letter-spacing:.16em;text-transform:uppercase;color:var(--gold)}
.special h2{margin:0;font:800 clamp(1.7rem,1.2rem + 2.6vw,2.6rem) var(--font-display);letter-spacing:-.03em;line-height:1.08;text-wrap:balance}
.special p{margin:0;font-size:1.02rem;line-height:1.5;max-width:46ch}
.special .row{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.bigstats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;max-width:460px}
.bigstats div{padding:12px;border-radius:12px;background:hsl(var(--h) var(--ts) var(--tl));border:1px solid hsl(var(--h) var(--es) var(--el))}
.bigstats b{display:block;font:800 1.25rem var(--font-display);font-variant-numeric:tabular-nums}
.bigstats span{font-size:.75rem;color:hsl(var(--h) var(--ms) var(--ml))}

/* ---------- HUD ---------- */
.hud{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;align-items:center;gap:6px;pointer-events:none;
  padding-top:calc(env(safe-area-inset-top,0px) + 10px);padding-bottom:8px;padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px))}
.hud > *{pointer-events:auto}
.spacer{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 10px;border-radius:999px;background:var(--hud);border:1px solid var(--hud-line);
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);color:var(--ink);font:700 .8rem var(--font-display);font-variant-numeric:tabular-nums;white-space:nowrap}
button.pill{cursor:pointer}
.pill svg{width:18px;height:18px}
.streak svg{fill:var(--ink-3)}
.streak.lit svg{fill:var(--gold-hi);filter:drop-shadow(0 0 6px rgba(242,178,51,.55))}
.goal svg circle{fill:none;stroke-width:3}
.goal .track{stroke:var(--line)}
.goal .prog{stroke:var(--ink);stroke-linecap:round;transition:stroke-dashoffset .5s cubic-bezier(.2,.8,.2,1)}
.goal.full .prog{stroke:var(--gold-hi)}
.combo{background:linear-gradient(135deg,var(--gold-hi),var(--gold));color:var(--gold-ink);border-color:transparent}
.combo small{font-size:.62rem;font-weight:700;letter-spacing:.04em;opacity:.8}
.combo.hot{box-shadow:0 0 0 3px rgba(242,178,51,.32),0 6px 18px -6px rgba(242,178,51,.85)}
.combo.bump{animation:comboPop .38s ease}
.xp small{font-size:.6rem;color:var(--ink-2);letter-spacing:.06em}
.menu-btn{width:36px;padding:0;justify-content:center}
.menu-btn svg{width:16px;height:16px;fill:var(--ink)}

.subhud{position:fixed;left:0;right:0;z-index:19;top:calc(env(safe-area-inset-top,0px) + 56px);display:flex;justify-content:space-between;align-items:center;gap:8px;pointer-events:none;
  padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px))}
.subpill{pointer-events:auto;display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 13px 0 10px;border-radius:999px;cursor:pointer;
  background:var(--hud);border:1px solid var(--hud-line);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);color:var(--ink);font:700 .72rem var(--font-display);letter-spacing:.02em}
.subpill svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2;stroke-linejoin:round}
.sub-right{margin-left:auto;display:flex;gap:6px;align-items:center;min-width:0}
.langpill{pointer-events:auto;display:inline-flex;padding:3px;gap:2px;height:36px;border-radius:999px;background:var(--hud);border:1px solid var(--hud-line);
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.langpill button{border:0;background:transparent;border-radius:999px;padding:0 10px;font:700 .68rem var(--font-display);letter-spacing:.05em;color:var(--ink-2);cursor:pointer}
.langpill button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.focus-chip{pointer-events:auto;display:inline-flex;align-items:center;gap:6px;height:36px;font-size:.72rem;font-weight:700;padding:0 6px 0 11px;border-radius:999px;border:1px solid var(--hud-line);background:var(--hud);color:var(--ink);cursor:pointer;
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);min-width:0}
.focus-chip b{font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.focus-chip span{display:grid;place-items:center;flex:none;width:22px;height:22px;border-radius:50%;background:var(--surface-2)}
.focus-chip span svg{width:10px;height:10px}

/* ---------- Feedback layers ---------- */
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:29;pointer-events:none}
.toasts{position:fixed;left:0;right:0;z-index:30;top:calc(env(safe-area-inset-top,0px) + 100px);display:grid;justify-items:center;gap:8px;pointer-events:none;padding:0 16px}
.toast{font:800 .9rem var(--font-display);padding:10px 16px;border-radius:12px;background:var(--surface);color:var(--ink);box-shadow:var(--shadow);animation:toastIn 2.3s both;text-align:center}
.toast.big{font-size:clamp(1.2rem,4.5vw,1.8rem);padding:14px 22px;background:linear-gradient(135deg,var(--gold-hi),var(--gold));color:var(--gold-ink);letter-spacing:-.01em}
.float{position:fixed;z-index:31;font:800 1rem var(--font-display);color:var(--gold);pointer-events:none;animation:floatUp 1.15s ease-out forwards;white-space:nowrap}

/* Run heat: escalates with consecutive right answers */
.card::after{content:"";position:absolute;inset:0;z-index:2;pointer-events:none;
  box-shadow:inset 0 0 0 calc(var(--heat, 0) * 5px) rgba(242,178,51,calc(var(--heat, 0) * .95)), inset 0 0 calc(var(--heat, 0) * 90px) rgba(255,120,30,calc(var(--heat, 0) * .45));
  transition:box-shadow .5s ease}
:root[data-tier="3"] .card::after,:root[data-tier="4"] .card::after,:root[data-tier="5"] .card::after{animation:heatPulse 1.1s ease-in-out infinite}
:root[data-tier="5"] .motif{animation:hueSpin 3s linear infinite}
.combo .flame{display:none;width:15px;height:15px;fill:#ff5e1a;transform-origin:50% 90%}
:root[data-tier="2"] .combo .flame,:root[data-tier="3"] .combo .flame,:root[data-tier="4"] .combo .flame,:root[data-tier="5"] .combo .flame{display:block;animation:flicker .45s ease-in-out infinite alternate}
:root[data-tier="4"] .combo,:root[data-tier="5"] .combo{animation:comboHeat .55s ease-in-out infinite alternate}
.xp.bump{animation:comboPop .4s ease}
.feed.shk1{animation:shk1 .26s linear}
.feed.shk2{animation:shk2 .32s linear}
.feed.shk3{animation:shk3 .4s linear}
.feed.fizzle{filter:grayscale(.85) brightness(.92);transition:filter .15s}
.feed{transition:filter .5s ease}
.flash{position:fixed;inset:0;z-index:28;pointer-events:none;background:rgba(255,226,150,.38);animation:flashOut .24s ease-out forwards}
.tally{position:fixed;z-index:31;display:flex;align-items:center;gap:6px;pointer-events:none;font:800 1rem var(--font-display);font-variant-numeric:tabular-nums;white-space:nowrap}
.tally span{padding:6px 10px;border-radius:9px;color:#fff;box-shadow:0 3px 0 rgba(0,0,0,.28);animation:tallyPop .32s cubic-bezier(.2,1.6,.4,1) both}
.tally .chips{background:#2f6fe4}
.tally .mult{background:#e5484d;animation-delay:.12s}
.tally i{font-style:normal;color:var(--ink);animation:tallyPop .3s .06s both}
.tally b{color:var(--gold);font-size:1.3em;animation:tallyPop .4s .26s cubic-bezier(.2,1.6,.4,1) both}
.tally.t3{font-size:1.2rem} .tally.t4{font-size:1.4rem} .tally.t5{font-size:1.6rem}
.tally.t4 b,.tally.t5 b{color:var(--gold-hi);text-shadow:0 2px 0 var(--gold-ink)}
/* Celebration word: condensed modern grotesque, gold gradient fill, solid drop shadow (no outline strokes) */
.bigtxt{position:fixed;inset:0;z-index:32;display:grid;place-items:center;pointer-events:none;text-align:center;padding:0 16px;
  animation:bigPop 1.35s cubic-bezier(.2,1.4,.4,1) both}
.bigtxt span{display:block;max-width:100%;font-family:"Bricolage Grotesque","Schibsted Grotesk",system-ui,sans-serif;font-weight:800;font-stretch:78%;
  font-variation-settings:"opsz" 96;line-height:.92;letter-spacing:-.025em;white-space:nowrap;
  background:linear-gradient(180deg,#fff6d2 0%,#ffd76e 40%,#f2a516 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 5px 0 #6b4300) drop-shadow(0 16px 26px rgba(0,0,0,.3))}

/* ---------- Sheets ---------- */
.scrim{position:fixed;inset:0;z-index:40;background:var(--scrim);animation:fade .2s ease}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;margin:0 auto;width:min(620px,100%);max-height:min(90%,820px);overflow-y:auto;overscroll-behavior:contain;
  background:var(--surface);color:var(--ink);border-radius:22px 22px 0 0;box-shadow:var(--shadow);
  padding-top:8px;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 24px);padding-left:max(18px, env(safe-area-inset-left,0px));padding-right:max(18px, env(safe-area-inset-right,0px));
  animation:sheetUp .34s cubic-bezier(.2,.8,.2,1)}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:4px auto 6px}
.sheet-head{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:6px 0 2px}
.sheet h2{margin:0;font:800 1.3rem var(--font-display);letter-spacing:-.02em;text-wrap:balance}
.sheet h3{margin:22px 0 6px;font:800 .72rem var(--font-display);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2)}
.lede{margin:8px 0 4px;color:var(--ink-2);line-height:1.5;max-width:58ch}
.iconbtn{width:40px;height:40px;border-radius:50%;border:0;background:var(--surface-2);display:grid;place-items:center;cursor:pointer;flex:none}
.iconbtn svg{width:16px;height:16px;stroke:var(--ink);fill:none;stroke-width:2.4;stroke-linecap:round}

.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:12px}
.stat{padding:12px;border-radius:12px;background:var(--surface-2);min-width:0}
.stat b{display:block;font:800 1.12rem var(--font-display);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.stat span{font-size:.74rem;color:var(--ink-2)}

.trow{--h:218;display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.tbadge{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;background:hsl(var(--h) var(--cs) var(--cl));border:1px solid hsl(var(--h) var(--es) var(--el))}
.tbadge svg{width:22px;height:22px;fill:hsl(var(--h) var(--as) var(--al))}
.tname{font-weight:700;font-size:.98rem;overflow-wrap:anywhere}
.tsub{font-size:.78rem;color:var(--ink-2);font-variant-numeric:tabular-nums;margin-top:1px}
.bar{height:5px;border-radius:3px;background:var(--surface-2);overflow:hidden;margin-top:7px;max-width:260px}
.bar i{display:block;height:100%;background:hsl(var(--h) var(--as) var(--al));border-radius:3px}
.tact{display:flex;gap:8px;align-items:center}
.mini{border:1px solid var(--line);background:transparent;border-radius:8px;padding:7px 10px;font-size:.74rem;font-weight:700;cursor:pointer;color:var(--ink-2)}
.mini[aria-pressed="true"]{background:hsl(var(--h) var(--as) var(--al));border-color:transparent;color:var(--on-acc)}

.switch{position:relative;width:46px;height:28px;flex:none;display:inline-block}
.switch input{position:absolute;inset:0;width:100%;height:100%;opacity:0;margin:0;cursor:pointer;z-index:1}
.switch span{position:absolute;inset:0;border-radius:14px;background:var(--surface-2);border:1px solid var(--line);transition:background-color .2s}
.switch span::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--ink-3);transition:transform .2s,background-color .2s}
.switch input:checked + span{background:var(--ink)}
.trow .switch input:checked + span{background:hsl(var(--h) var(--as) var(--al))}
.switch input:checked + span::after{transform:translateX(18px);background:var(--surface)}
.switch input:focus-visible + span{outline:3px solid var(--ink-2);outline-offset:2px}

.srow{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px 16px;padding:12px 0;border-bottom:1px solid var(--line)}
.srow .lbl{font-weight:600;font-size:.95rem}
.srow small{display:block;font-weight:400;color:var(--ink-2);font-size:.79rem;margin-top:2px;line-height:1.4;max-width:46ch}
.seg{display:inline-flex;padding:3px;border-radius:10px;background:var(--surface-2);gap:2px;flex:none}
.seg button{border:0;background:transparent;padding:8px 12px;border-radius:8px;font-size:.82rem;font-weight:700;color:var(--ink-2);cursor:pointer;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--seg-on);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.14)}
.seg.wide{display:flex;width:100%}
.seg.wide button{flex:1;padding:12px 10px;font-size:.95rem}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;border-radius:12px;border:0;background:var(--ink);color:var(--surface);
  font:700 .86rem var(--font-display);cursor:pointer;letter-spacing:.01em}
.card .btn{background:hsl(var(--h) var(--as) var(--al));color:var(--on-acc)}
.btn.ghost{background:var(--surface-2);color:var(--ink)}
.btn.danger{background:var(--bad);color:#fff}
.btn.block{width:100%;margin-top:22px;min-height:56px}
.note{margin:10px 0 0;font-size:.8rem;color:var(--ink-2);line-height:1.45;max-width:58ch}
.confirm{margin-top:12px;padding:14px;border-radius:12px;background:var(--surface-2);display:grid;gap:10px}
.confirm p{margin:0;font-size:.88rem;line-height:1.45}
.confirm .row{display:flex;gap:8px;flex-wrap:wrap}

/* Phrasebook */
.search{position:relative;display:block;margin-top:12px}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:18px;height:18px;stroke:var(--ink-3);fill:none;stroke-width:2.2;stroke-linecap:round;pointer-events:none}
.search input{width:100%;min-height:50px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);padding:0 14px 0 42px;font:inherit;font-size:16px;-webkit-appearance:none;appearance:none}
.search input::placeholder{color:var(--ink-3)}
.search input:focus{outline:2px solid var(--ink-2);outline-offset:1px}
.bk-head{--h:218;display:flex;align-items:center;gap:10px;margin:22px 0 4px}
.bk-head i{width:12px;height:12px;transform:rotate(45deg);border-radius:2px;background:hsl(var(--h) var(--as) var(--al));flex:none}
.bk-head b{font:800 .95rem var(--font-display);letter-spacing:-.01em}
.bk-head span{font-size:.78rem;font-weight:700;color:var(--ink-2);text-transform:uppercase;letter-spacing:.08em}
.prow{--h:218;display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.prow .playbtn{background:hsl(var(--h) var(--cs) var(--cl));color:hsl(var(--h) var(--as) var(--al))}
.ptxt{display:grid;gap:1px;padding:6px 0;border:0;background:none;text-align:left;cursor:pointer;min-width:0}
.ptxt b{font-weight:700;font-size:1.05rem;overflow-wrap:anywhere}
.ptxt b svg{display:inline-block;vertical-align:-2px;width:15px;height:15px;margin-left:5px;color:var(--good)}
.ptxt span{font-size:.9rem;color:var(--ink-2)}
.pmore{grid-column:2;display:grid;gap:6px;padding:0 0 8px;font-size:.9rem;color:var(--ink-2);line-height:1.45}
.pmore .pron{font-size:.98rem;color:var(--ink-2)}
.pmore .pron b{color:hsl(var(--h) var(--as) var(--al))}
.empty-note{margin:18px 0;color:var(--ink-2)}

/* Family profiles */
.sub-left{display:flex;gap:6px;align-items:center;min-width:0}
.who-pill{pointer-events:auto;display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 12px 0 4px;border-radius:999px;cursor:pointer;max-width:42vw;
  background:var(--hud);border:1px solid var(--hud-line);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);color:var(--ink);font:700 .72rem var(--font-display)}
.who-pill .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.av{--ah:218;flex:none;display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:hsl(var(--ah) var(--as) var(--al));color:var(--on-acc);
  font:800 .74rem var(--font-display);text-transform:uppercase}
.av.lg{width:44px;height:44px;font-size:1rem}
.who-list{display:grid;gap:10px;margin-top:14px}
.who-row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:12px;width:100%;min-height:68px;padding:10px 14px;border-radius:14px;
  border:1.5px solid var(--line);background:var(--surface-2);color:var(--ink);text-align:left;cursor:pointer}
.who-row[aria-current="true"]{border-color:var(--ink)}
.who-row b{display:block;font:800 1rem var(--font-display);letter-spacing:-.01em;overflow-wrap:anywhere}
.who-row small{display:block;margin-top:2px;font-size:.8rem;color:var(--ink-2);font-variant-numeric:tabular-nums}
.who-row .go{font:700 .74rem var(--font-display);color:var(--ink-2)}
.field-row{display:flex;gap:10px;margin-top:10px;flex-wrap:wrap}
.field-row input{flex:1 1 180px;min-width:0;min-height:50px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);padding:0 14px;font:inherit;font-size:16px}
.field-row input:focus{outline:2px solid var(--ink-2);outline-offset:1px}
.field-row .btn{min-height:50px}
.board{display:grid;margin-top:6px}
.brow{display:grid;grid-template-columns:1.4em auto minmax(0,1fr) auto;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.brow .rank{font:800 .9rem var(--font-display);color:var(--ink-3);text-align:center;font-variant-numeric:tabular-nums}
.brow .rank.top{color:var(--gold)}
.brow b{display:block;font-weight:700;font-size:.98rem;overflow-wrap:anywhere}
.brow b em{font-style:normal;font-size:.7rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin-left:6px}
.brow small{display:block;font-size:.78rem;color:var(--ink-2);font-variant-numeric:tabular-nums}
.brow .bxp{font:800 .95rem var(--font-display);font-variant-numeric:tabular-nums;text-align:right}
.brow .bxp span{display:block;font:600 .72rem var(--font-body);color:var(--ink-2)}
.sync{display:inline-flex;align-items:center;gap:6px;margin-top:8px;font-size:.8rem;font-weight:600;color:var(--ink-2)}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--good)}
.sync.off i{background:var(--ink-3)}

/* Onboarding */
.ob-mark{width:64px;height:64px;margin:6px 0 0;fill:none;stroke:hsl(218 var(--as) var(--al));stroke-width:2.2}

/* ---------- Level up ---------- */
.lvlup{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:var(--scrim);padding:24px;animation:fade .2s ease;cursor:pointer}
.lvlup-card{--h:42;position:relative;width:min(360px,100%);padding:26px 22px 24px;border-radius:22px;background:hsl(var(--h) var(--cs) var(--cl));color:hsl(var(--h) var(--qs) var(--ql));
  text-align:center;box-shadow:var(--shadow);overflow:hidden;animation:popIn .55s cubic-bezier(.2,1.4,.4,1)}
.lvlup-card .badge{width:128px;height:128px;margin:0 auto 8px;fill:none;stroke:hsl(var(--h) var(--as) var(--al));stroke-width:1.6;animation:spin 9s linear infinite}
.lvlup-card h2{margin:6px 0 4px;font:800 1.9rem var(--font-display);letter-spacing:-.03em}
.lvlup-card p{margin:0;font-size:.92rem;color:hsl(var(--h) var(--ms) var(--ml))}
.lvlup-card .tn{font-weight:700;margin-top:4px;color:hsl(var(--h) var(--qs) var(--ql))}

@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(2px)}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes nudge{0%,100%{transform:translate(-50%,0)}50%{transform:translate(-50%,4px)}}
@keyframes popIn{0%{transform:scale(.92)}55%{transform:scale(1.03)}100%{transform:scale(1)}}
@keyframes floatUp{0%{opacity:0;transform:translateY(6px) scale(.9)}15%{opacity:1;transform:translateY(0) scale(1.1)}100%{opacity:0;transform:translateY(-52px) scale(1)}}
@keyframes toastIn{0%{opacity:0;transform:translateY(-10px) scale(.94)}10%{opacity:1;transform:none}82%{opacity:1;transform:none}100%{opacity:0;transform:translateY(-6px)}}
@keyframes sheetUp{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes comboPop{0%{transform:scale(1)}40%{transform:scale(1.22)}100%{transform:scale(1)}}
@keyframes shimmer{0%,100%{box-shadow:0 0 0 0 rgba(242,178,51,0)}50%{box-shadow:0 0 0 4px rgba(242,178,51,.35)}}
@keyframes heatPulse{50%{opacity:.55}}
@keyframes hueSpin{to{filter:hue-rotate(360deg)}}
@keyframes flicker{from{transform:scaleY(.82) rotate(-5deg)}to{transform:scaleY(1.14) rotate(5deg)}}
@keyframes comboHeat{to{box-shadow:0 0 0 4px rgba(255,120,30,.45),0 0 26px rgba(255,120,30,.85)}}
@keyframes shk1{25%{transform:translate(-2px,1px)}50%{transform:translate(2px,-1px)}75%{transform:translate(-1px,0)}}
@keyframes shk2{20%{transform:translate(-4px,2px) rotate(-.3deg)}40%{transform:translate(4px,-2px) rotate(.3deg)}60%{transform:translate(-3px,1px)}80%{transform:translate(2px,-1px)}}
@keyframes shk3{15%{transform:translate(-7px,3px) rotate(-.8deg)}30%{transform:translate(7px,-3px) rotate(.8deg)}45%{transform:translate(-6px,2px) rotate(-.5deg)}60%{transform:translate(5px,-2px)}80%{transform:translate(-2px,1px)}}
@keyframes flashOut{to{opacity:0}}
@keyframes tallyPop{0%{transform:scale(0) rotate(-12deg);opacity:0}100%{transform:none;opacity:1}}
@keyframes bigPop{0%{transform:scale(.3) rotate(-10deg);opacity:0}18%{transform:scale(1.18) rotate(3deg);opacity:1}32%{transform:scale(1) rotate(-2deg)}78%{opacity:1}100%{transform:scale(1.45);opacity:0}}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
}
@media (max-width:360px){
  .subpill span{display:none}
  .subpill{padding:0 10px}
}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><symbol id="roundel" viewBox="0 0 100 100"></symbol><symbol id="flower" viewBox="0 0 100 100"></symbol></defs></svg>

<div class="app">
  <header class="hud" aria-label="Score">
    <button class="pill streak" id="hudStreak" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2c-3.5 4.4-6 7.3-6 11.6A6 6 0 0 0 12 20a6 6 0 0 0 6-6.4c0-2.3-1.1-4.2-2.6-5.6.1 1.9-.6 3.3-1.9 3.9C13.9 9.5 13.3 5.6 12 2z"/></svg>
      <span id="streakN">0</span>
    </button>
    <button class="pill goal" id="hudGoal" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle class="track" cx="12" cy="12" r="9"/><circle class="prog" id="goalRing" cx="12" cy="12" r="9" transform="rotate(-90 12 12)" stroke-dasharray="56.55" stroke-dashoffset="56.55"/></svg>
      <span id="goalN">0/15</span>
    </button>
    <div class="spacer"></div>
    <div class="pill combo" id="hudCombo" hidden aria-live="polite"><svg class="flame" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2c-3.5 4.4-6 7.3-6 11.6A6 6 0 0 0 12 20a6 6 0 0 0 6-6.4c0-2.3-1.1-4.2-2.6-5.6.1 1.9-.6 3.3-1.9 3.9C13.9 9.5 13.3 5.6 12 2z"/></svg><span id="comboN">2</span><small id="comboLbl">run</small></div>
    <div class="pill xp" id="hudXp"><span id="xpN">0</span><small>XP</small></div>
    <button class="pill menu-btn" id="menuBtn" type="button">
      <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="1" y="1" width="6" height="6" rx="1.5"/><rect x="9" y="1" width="6" height="6" rx="1.5"/><rect x="1" y="9" width="6" height="6" rx="1.5"/><rect x="9" y="9" width="6" height="6" rx="3"/></svg>
    </button>
  </header>
  <div class="subhud">
    <div class="sub-left">
      <button class="who-pill" id="whoBtn" type="button" hidden></button>
      <button class="subpill" id="bookBtn" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5zM4 20.5A2.5 2.5 0 0 0 6.5 23H20v-5"/></svg><span data-i18n="book"></span></button>
    </div>
    <div class="sub-right">
      <button class="focus-chip" id="focusChip" type="button" hidden></button>
      <div class="langpill" role="group" id="langPill"><button type="button" data-lang="en">EN</button><button type="button" data-lang="tr">TR</button></div>
    </div>
  </div>
  <main class="feed" id="feed" tabindex="-1" aria-label="Phrase feed"></main>
  <canvas id="fx" aria-hidden="true"></canvas>
  <div class="toasts" id="toasts" aria-live="polite"></div>
</div>

<div class="scrim" id="scrim" hidden></div>

<section class="sheet" id="bookSheet" role="dialog" aria-modal="true" aria-labelledby="bookTitle" hidden>
  <div class="grab"></div>
  <div class="sheet-head"><h2 id="bookTitle" data-i18n="book"></h2><button class="iconbtn" type="button" data-close data-i18n-aria="close"><svg viewBox="0 0 16 16"><path d="M3.5 3.5l9 9M12.5 3.5l-9 9"/></svg></button></div>
  <label class="search"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L20 20"/></svg><span class="sr" data-i18n="searchPh" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)"></span><input id="bookQ" type="search" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="search"></label>
  <div id="bookList"></div>
</section>

<section class="sheet" id="menu" role="dialog" aria-modal="true" aria-labelledby="menuTitle" hidden>
  <div class="grab"></div>
  <div class="sheet-head"><h2 id="menuTitle" data-i18n="progress"></h2><button class="iconbtn" type="button" data-close data-i18n-aria="close"><svg viewBox="0 0 16 16"><path d="M3.5 3.5l9 9M12.5 3.5l-9 9"/></svg></button></div>
  <div id="syncLine"></div>
  <div class="stats" id="stats"></div>
  <div id="familyBox" hidden>
    <h3 lang="it">La famiglia</h3>
    <div class="board" id="board"></div>
    <div class="field-row"><button class="btn ghost" id="switchBtn" type="button" data-i18n="switchPerson"></button></div>
  </div>
  <h3 data-i18n="topics"></h3>
  <div id="topicList"></div>
  <h3 data-i18n="settings"></h3>
  <div id="settings"></div>
  <h3 data-i18n="reset"></h3>
  <div id="resetBox"></div>
</section>

<section class="sheet" id="whoSheet" role="dialog" aria-modal="true" aria-labelledby="whoTitle" hidden>
  <div class="grab"></div>
  <div class="sheet-head"><h2 id="whoTitle" lang="it">Chi impara oggi?</h2><button class="iconbtn" id="whoClose" type="button" data-close data-i18n-aria="close"><svg viewBox="0 0 16 16"><path d="M3.5 3.5l9 9M12.5 3.5l-9 9"/></svg></button></div>

let lastCat = null;

    ctx.save(); ctx.globalAlpha = Math.max(0, 1 - p.life / p.max); ctx.translate(p.x * dpr, p.y * dpr); ctx.rotate(p.r); ctx.fillStyle = p.c;
    if (p.ember){ ctx.beginPath(); ctx.arc(0, 0, p.s * dpr / 2, 0, Math.PI * 2); ctx.fill(); }
    else if (p.star) petal(ctx, p.s * dpr * 1.2); else ctx.fillRect(-p.s * dpr / 2, -p.s * dpr * .3, p.s * dpr, p.s * dpr * .6);
    ctx.restore();
  }
  raf = parts.length ? requestAnimationFrame(step) : 0;
}
function burstFrom(anchor, hue, tier, extra){
  if (reduceMotion || !anchor) return;
  const r = anchor.getBoundingClientRect(), tt = (tier || 0) + (extra ? 2 : 0);
  spawn(r.left + r.width * .5, r.top + r.height * .5, hue, Math.min(130, 32 + tt * 18), 5.5 + tt * .8, 3 + tt * .3);
}
function shower(hue){ if (reduceMotion) return; for (let i = 0; i < 6; i++) spawn(innerWidth * (0.1 + 0.16 * i), -10, hue, 18, 4, -2); }
const toastsEl = $("#toasts");
function toast(msg, kind){
  while (toastsEl.children.length > 2) toastsEl.firstChild.remove();
  const e = h("div", {class: "toast" + (kind ? " " + kind : "")}, msg);
  toastsEl.append(e); setTimeout(() => e.remove(), 2400);
}
function floatText(anchor, txt){
  if (!anchor) return;
  const r = anchor.getBoundingClientRect(), e = h("div", {class:"float"}, txt);
  e.style.left = (r.left + r.width / 2 - 30) + "px"; e.style.top = (r.top - 8) + "px";
  document.body.append(e); setTimeout(() => e.remove(), 1250);
}
let actx = null;
function ac(){
  if (!S.settings.sound) return null;
  try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); if (actx.state === "suspended") actx.resume(); return actx; } catch(e){ return null; }
}
function tone(f, t0, dur, type, vol){
  const a = ac(); if (!a) return;
  try {
    const o = a.createOscillator(), g = a.createGain(), tm = a.currentTime + t0;
    o.type = type; o.frequency.value = f;
    g.gain.setValueAtTime(0.0001, tm); g.gain.exponentialRampToValueAtTime(vol, tm + 0.012); g.gain.exponentialRampToValueAtTime(0.0001, tm + dur);
    o.connect(g); g.connect(a.destination); o.start(tm); o.stop(tm + dur + 0.03);
  } catch(e){}
}
const PENTA = [0, 2, 4, 7, 9, 12, 14, 16, 19, 21, 24];
function sfxRight(run){
  const idx = run - 1, n = PENTA.length;
  const semis = Math.min(28, PENTA[idx % n] + 12 * Math.min(1, Math.floor(idx / n)));
  const f = 440 * Math.pow(2, semis / 12), tier = tierOf(run);
  tone(f, 0, .3, "sine", .16); tone(f * 2, 0, .16, "triangle", .04);
  if (run >= 3) tone(f * 1.5, .07, .24, "sine", .07);
  if (tier >= 3) tone(73.4, 0, .24, "sine", .26);
  if (tier >= 4){ tone(f * 2.5, .12, .18, "triangle", .05); tone(f * 3, .19, .2, "sine", .04); }
}
function sfxFizzle(){ [392, 330, 262, 196].forEach((f, i) => tone(f, i * .09, .24, "triangle", .09)); }
function sfxWrong(){ tone(196, 0, .22, "triangle", .1); tone(147, .08, .32, "sine", .09); }
function sfxFanfare(){ [0, 4, 7, 12, 16].forEach((s, i) => tone(523.25 * Math.pow(2, s / 12), i * .08, .36, "sine", .12)); }
function buzz(pat){ if (!S.settings.haptics) return; try { if (navigator.vibrate) navigator.vibrate(pat); } catch(e){} }

/* ================= Level up ================= */
const lvlEl = $("#lvlup"); let lvlT = null;

/* ================= Sheets ================= */
const scrim = $("#scrim"), menuEl = $("#menu"), bookEl = $("#bookSheet"), obEl = $("#onboard"), whoEl = $("#whoSheet");

function switchEl(id, checked, label, onChange){

  input.addEventListener("change", () => onChange(input.checked));

}
function segEl(options, value, onPick, label, cls){

  });

}
function renderMenu(){
  renderSyncLine(); renderBoard();
  const now = Date.now();
  let due = 0; for (const id in S.p){ const st = S.p[id]; if (st[2] > 0 && st[0] >= 1 && st[1] <= now) due++; }
  due += S.relearn.length;

  const list = $("#topicList"); list.replaceChildren();
  CATS.forEach(cat => {
    const T = S.topics[cat.id], ids = PHR.filter(p => p.cat === cat.id).map(p => p.id), k = learntCount(ids);
    const body = h("div", null, h("div", {class:"tname"}, h("span", {lang:"it"}, cat.it), " · ", cat[S.lang]), h("div", {class:"tsub"}, t("learntOf", k, ids.length)),
      h("div", {class:"bar"}, h("i", {style: "width:" + Math.round(100 * k / ids.length) + "%"})));
    const focusBtn = h("button", {class:"mini", type:"button", "aria-pressed": String(S.focus === cat.id)}, S.focus === cat.id ? t("focused") : t("focus"));
    focusBtn.addEventListener("click", () => {
      S.focus = S.focus === cat.id ? null : cat.id;
      if (S.focus) T.on = true;
      saveSoon(); updateHUD(); refreshAhead(); fixEmpty(); renderMenu();
    });
    const sw = switchEl("tsw-" + cat.id, T.on, t("include", cat[S.lang]), v => {
      T.on = v; if (!v && S.focus === cat.id) S.focus = null;
      saveSoon(); updateHUD(); refreshAhead(); fixEmpty();
    });
    list.append(h("div", {class:"trow", style:"--h:" + cat.h}, h("div", {class:"tbadge", html: FLOWER}), body, h("div", {class:"tact"}, focusBtn, sw)));
  });
  const srow = (label, help, ctrl) => h("div", {class:"srow"}, h("div", null, h("div", {class:"lbl"}, label), help && h("small", null, help)), ctrl);
  $("#settings").replaceChildren(
    srow(t("setLang"), null, segEl([["en","English"],["tr","Türkçe"]], S.lang, v => setLang(v), t("setLang"))),
    srow(t("setGoal"), t("setGoalHelp"), segEl([[10,"10"],[15,"15"],[30,"30"]], S.settings.goal, v => { S.settings.goal = v; if (S.today.n < v) S.today.hit = false; saveSoon(); updateHUD(); }, t("setGoal"))),
    audioOK && srow(t("setSpeak"), t("setSpeakHelp"), switchEl("set-speak", S.settings.speak, t("setSpeak"), v => { S.settings.speak = v; saveSoon(); })),
    srow(t("setAuto"), t("setAutoHelp"), switchEl("set-auto", S.settings.auto, t("setAuto"), v => { S.settings.auto = v; saveSoon(); })),
    srow(t("setSound"), null, switchEl("set-sound", S.settings.sound, t("setSound"), v => { S.settings.sound = v; saveSoon(); if (v) tone(784, 0, .2, "sine", .12); })),
    srow(t("setHaptics"), t("setHapticsHelp"), switchEl("set-haptics", S.settings.haptics, t("setHaptics"), v => { S.settings.haptics = v; saveSoon(); buzz(20); })),
    !audioOK && h("p", {class:"note"}, t("noAudio")));
  renderReset();
}
function renderReset(){
  const box = $("#resetBox");
  const btn = h("button", {class:"btn ghost", type:"button"}, t("resetBtn"));
  btn.addEventListener("click", () => {
    const cancel = h("button", {class:"btn ghost", type:"button"}, t("cancel"));
    const go = h("button", {class:"btn danger", type:"button"}, t("resetAll"));
    cancel.addEventListener("click", renderReset);
    go.addEventListener("click", () => {
      const keep = {lang: S.lang, settings: S.settings, pid: S.pid, pname: S.pname, pcreated: S.pcreated};

/* Phrasebook */

      const txt = h("button", {class:"ptxt", type:"button", "aria-expanded":"false"}, h("b", {lang:"it", html: esc(p.it) + (learnt ? IC.check : "")}), h("span", null, meaning(p)));

$("#bookQ").addEventListener("input", renderBook);

/* Onboarding */
function openOnboard(){

  goal.id = "obGoal"; $("#obGoal").replaceWith(goal);

$("#obLang").addEventListener("click", e => { const b = e.target.closest("button[data-lang]"); if (b) setLang(b.dataset.lang); });

  S.onboarded = true; saveSoon();

/* ================= Language ================= */
function syncLangButtons(){
  document.querySelectorAll("#langPill button, #obLang button, #whoLang button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang === S.lang)));
}
function applyStatic(){
  document.documentElement.lang = S.lang;
  document.querySelectorAll("[data-i18n]").forEach(el => { el.textContent = t(el.dataset.i18n); });
  document.querySelectorAll("[data-i18n-aria]").forEach(el => el.setAttribute("aria-label", t(el.dataset.i18nAria)));
  $("#menuBtn").setAttribute("aria-label", t("menuAria"));
  $("#comboLbl").textContent = t("run");
  $("#bookQ").placeholder = t("searchPh");
  $("#langPill").setAttribute("aria-label", t("setLang"));
  syncLangButtons();
}
function setLang(v){
  if (v !== "en" && v !== "tr") return;
  S.lang = v; saveSoon();
  applyStatic(); updateHUD(false);
  for (let i = Math.max(active, 0); i < cards.length; i++){
    const c = cards[i];
    if (c.kind || c.status === "done" || c.learned) continue;
    const fresh = Object.assign({}, c); fresh.el = null; fresh.res = null;
    replaceCard(i, fresh);
  }
  if (!menuEl.hidden) renderMenu();
  if (!bookEl.hidden) renderBook();
  if (!whoEl.hidden) renderWho();
  renderAccount();
}
$("#langPill").addEventListener("click", e => { const b = e.target.closest("button[data-lang]"); if (b) setLang(b.dataset.lang); });

/* ================= Profiles ================= */
function liveStreak(st){ const td = todayStr(); return st && (st.last === td || (st.last && dayDiff(st.last, td) === 1)) ? (st.count || 0) : 0; }
function initialOf(n){ return (String(n || "?").trim()[0] || "?").toUpperCase(); }
function hueOf(x){ let v = 7; for (const ch of String(x)) v = (v * 31 + ch.charCodeAt(0)) % 360; return v; }
function avEl(name, big){ return h("span", {class: "av" + (big ? " lg" : ""), style: "--ah:" + hueOf(name), "aria-hidden": "true"}, initialOf(name)); }
function learntOfState(st){ return Object.values((st && st.p) || {}).filter(v => Array.isArray(v) && v[0] >= 2).length; }
function currentPlayer(){ return profiles.find(p => p.id === profileId) || null; }
function summaryOf(pl){
  const st = pl.id === profileId ? S : (lsGet(stateKey(pl.id)) || {});
  return {xp: st.xp || 0, streak: liveStreak(st.streak), learnt: learntOfState(st)};
}
function adoptState(st){
  S = migrate(st); S.combo = 0; runXP = 0; xpShown = S.xp;
  applyStatic(); setHeat(); updateHUD(false); rebuildFeed();
}
function afterChoose(){
  renderAccount(); closeSheets();
  if (!S.onboarded) openOnboard(); else autoSpeak(cards[active]);
}
function selectProfile(pl){
  if (pl.id === profileId){ closeSheets(); return; }
  persist();
  const st = lsGet(stateKey(pl.id)) || Object.assign(fresh(), {lang: S.lang});
  profileId = pl.id; lsSet(LS_PROFILE, profileId);
  adoptState(st);
  S.pid = pl.id; S.pname = pl.name; persist();
  afterChoose();
}
function createProfile(){
  const input = $("#whoName"), note = $("#whoNote");
  const name = input.value.trim().replace(/\s+/g, " ").slice(0, 24);
  if (!name){ note.textContent = t("whoNeedName"); input.focus(); return; }
  if (profiles.some(p => String(p.name).toLowerCase() === name.toLowerCase())){ note.textContent = t("whoTaken"); return; }
  const id = (slug(name).slice(0, 20) || "p") + "-" + Math.random().toString(36).slice(2, 6);
  const pl = {id, name, createdAt: Date.now()};
  const first = !profiles.length;
  profiles.push(pl); lsSet(LS_PROFILES, profiles);
  input.value = ""; note.textContent = "";
  if (first){
    /* the first person on this phone keeps whatever was played before names existed */
    profileId = id; lsSet(LS_PROFILE, id);
    S.pid = id; S.pname = name; persist();
    afterChoose();
  } else {
    lsSet(stateKey(id), Object.assign(fresh(), {lang: S.lang, pid: id, pname: name}));
    selectProfile(pl);
  }
}
function renderAccount(){
  const pill = $("#whoBtn"), pl = currentPlayer();
  if (pl){ pill.hidden = false; pill.replaceChildren(avEl(pl.name), h("span", {class:"nm"}, pl.name)); pill.setAttribute("aria-label", t("whoAria")); }
  else pill.hidden = true;
  if (!menuEl.hidden){ renderSyncLine(); renderBoard(); }
}
function renderSyncLine(){
  const pl = currentPlayer();
  $("#syncLine").replaceChildren(h("p", {class: "sync"}, h("i"), pl ? t("syncOn", pl.name) : t("syncOff")));
}
function renderBoard(){
  const box = $("#familyBox");
  if (!profiles.length){ box.hidden = true; return; }
  box.hidden = false;
  const rows = profiles.map(pl => Object.assign({pl}, summaryOf(pl))).sort((a, b) => b.xp - a.xp);
  $("#board").replaceChildren(...rows.map((r, i) => h("div", {class:"brow"},
    h("span", {class: "rank" + (i === 0 && r.xp > 0 && rows.length > 1 ? " top" : "")}, i + 1),
    avEl(r.pl.name, false),
    h("div", null,
      h("b", null, r.pl.name, r.pl.id === profileId && h("em", null, t("you"))),
      h("small", null, LEVELS[levelIdx(r.xp)][1] + " · " + t("boardSub", r.streak, r.learnt))),
    h("div", {class:"bxp"}, fmt(r.xp), h("span", null, "XP")))));
}
function openWho(forced){
  whoForced = !!forced;
  $("#whoClose").hidden = whoForced;
  $("#whoNote").textContent = "";
  syncLangButtons(); renderWho();
  menuEl.hidden = true; bookEl.hidden = true; obEl.hidden = true; whoEl.hidden = false; scrim.hidden = false; whoEl.scrollTop = 0;
}
function renderWho(){
  const list = $("#whoList"); list.replaceChildren();
  profiles.slice().sort((a, b) => String(a.name).localeCompare(String(b.name))).forEach(pl => {
    const cur = pl.id === profileId, sm = summaryOf(pl);
    const b = h("button", {class:"who-row", type:"button", "aria-current": String(cur)},
      avEl(pl.name, true),
      h("span", null, h("b", null, pl.name), h("small", null, t("whoLevel", LEVELS[levelIdx(sm.xp)][1], fmt(sm.xp)))),
      h("span", {class:"go"}, cur ? h("span", {html: IC.check, style:"display:block;width:20px;height:20px;color:var(--good)"}) : "\u203a"));
    b.addEventListener("click", () => selectProfile(pl));
    list.append(b);
  });
  $("#whoName").placeholder = t("whoPh");
}
$("#whoCreate").addEventListener("click", createProfile);
$("#whoName").addEventListener("keydown", e => { if (e.key === "Enter") createProfile(); });
$("#whoBtn").addEventListener("click", () => openWho(false));
$("#switchBtn").addEventListener("click", () => openWho(false));

/* ================= Keyboard ================= */
document.addEventListener("keydown", e => {
  if (e.target.closest && e.target.closest("input, textarea")) return;
  if (!lvlEl.hidden){ hideLevelUp(); return; }
  if (sheetOpen()){ if (e.key === "Escape" && obEl.hidden) closeSheets(); return; }
  const c = cards[active]; if (!c) return;
  const k = e.key.toLowerCase();
  if (k === "arrowdown" || k === "j" || k === "pagedown"){ e.preventDefault(); goTo(active + 1); return; }
  if (k === "arrowup" || k === "k" || k === "pageup"){ e.preventDefault(); goTo(Math.max(0, active - 1)); return; }
  if (c.kind || c.mode === "learn" || c.status === "done"){ if (k === "enter" || k === " "){ e.preventDefault(); if (c.mode === "learn") learnDone(c, true, c.el.querySelector(".learn-actions .btn")); goTo(active + 1); } return; }
  if (k === "p"){ speak(c.p.it, null, false); return; }
  if (c.opts){ const i = "1234".indexOf(k) >= 0 ? "1234".indexOf(k) : "abcd".indexOf(k); if (i >= 0){ e.preventDefault(); answerChoice(c, i); } }
  else { if (!c.revealed && (k === " " || k === "enter" || k === "r")){ e.preventDefault(); c.reveal(); } else if (c.revealed && (k === "1" || k === "n")) c.grade(false); else if (c.revealed && (k === "2" || k === "y")) c.grade(true); }
});

/* ================= Boot ================= */
xpShown = S.xp;
applyStatic();
setHeat();
updateHUD(false);
ensureAhead();
setActive(0);
renderAccount();
if (!profileId) openWho(true); else if (!S.onboarded) openOnboard();
if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")){
  addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}
})();
